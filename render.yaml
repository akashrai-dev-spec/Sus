services:
  - type: web
    name: sus-server
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: sus-web
    runtime: node
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://sus-server-t5te.onrender.com
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://sus-server-t5te.onrender.com
